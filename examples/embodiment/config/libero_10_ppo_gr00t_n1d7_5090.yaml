defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/gr00t_n1d7@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: ${oc.env:EXP_NAME,libero_10_ppo_gr00t_n1d7_5090}
    logger_backends: ["wandb", "tensorboard"]
    wandb_proxy: null

  max_epochs: 150   # mirror the N1.5 long run budget (global_step_150)
  max_steps: -1

  only_eval: False
  val_check_interval: 50
  save_interval: 50

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:

  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 8
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0 # entropy regularization coefficient, set to 0.0 for flow-sde, 0.005 for flow-noise
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 8    # N1.7-validated (vs N1.5's 16): the 2B Cosmos backbone is much heavier on 2x32GB
    max_episode_steps: 480 # max episode steps for truncation (matches the N1.5 long setup)
    max_steps_per_rollout_epoch: 480
    reward_coef: ${algorithm.reward_coef}
    auto_reset: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
  eval:
    total_num_envs: 8   # in-training eval envs are resident alongside train envs; keep small to avoid OOM
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:GROOT_N1D7_CKPT,/path/to/GR00T-N1.7-LIBERO/libero_10}
    backbone_model_path: ${oc.env:GROOT_N1D7_BACKBONE,/path/to/Cosmos-Reason2-2B}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2     # N1.7-validated for 2x32GB (do NOT copy N1.5's 8: 2B backbone)
  # rollout_size/rank = (envs/gpus)*(steps_per_rollout/chunks) = (8/2)*(480/16) = 120.
  # PPO minibatch (= global_batch_size/gpus) must divide 120 and be a multiple of micro(2):
  # 40/2 = 20 -> 120/20 = 6 minibatch updates/rollout (mirrors N1.5's cadence), grad_accum = 20/2 = 10.
  global_batch_size: 40
  seed: 1234
  enable_offload: True    # 2B backbone: keep offload on for 2x32GB

  model:
    model_type: "gr00t_n1d7"
    model_path: ${oc.env:GROOT_N1D7_CKPT,/path/to/GR00T-N1.7-LIBERO/libero_10}
    backbone_model_path: ${oc.env:GROOT_N1D7_BACKBONE,/path/to/Cosmos-Reason2-2B}
    embodiment_tag: "libero_sim" # N1.7 uses libero_sim (N1.6 used libero_panda)
    add_value_head: True
    # Match Isaac-GR00T validated LIBERO rollout defaults.
    num_action_chunks: 16
    denoising_steps: 4

    # flow-sde noise (GR00T RL head). model/gr00t_n1d7.yaml already selects flow_sde; set here
    # explicitly so this config is self-documenting and matches the N1.5 flow-sde run.
    rl_head_config:
      noise_method: "flow_sde"  # [flow_sde, flow_cps, reinflow] -- flow_sde injects noise via ODE->SDE transform
      joint_logprob: False      # False for flow-sde, True for reinflow (learnable noise)
      noise_level: 0.5          # flow-sde noise intensity

  optim:
    lr: 1.0e-6      # openpi flow-sde actor LR (matches the N1.5 flowsde_lropenpi run)
    value_lr: 1.0e-4  # openpi flow-sde value LR
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0    # N1.7 default
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: True
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
